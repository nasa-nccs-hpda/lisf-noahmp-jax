name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install package
        run: uv sync --locked --no-editable
      - name: Test installed package
        run: uv run --locked --no-editable --extra test python -m pytest tests/test_lai_tracker.py -v
      - name: Smoke test CLI
        run: uv run --locked --no-editable lisf-noahmp-jax --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t lisf-noahmp-jax:ci .
      - name: Smoke test container
        run: docker run --rm lisf-noahmp-jax:ci --help
