name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: the full suite

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  UV_VERSION: "0.13.7"

jobs:
  fast:
    # CLI smoke plus a replay subset (~4 min): LAI tracker, LDT parameter maps, the shipped 5-day SGP example run against Fortran output (examples/sgp_5d), Noah-MP 5.0 deep-snow and land-ice replays against Fortran data in tests/data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install from the lock file
        run: uv sync --locked --extra test
      - name: Smoke test CLI
        run: uv run --locked lisf-noahmp-jax --help
      - name: Replay subset
        run: uv run --locked pytest -q tests/test_lai_tracker.py tests/test_ldt.py tests/test_forcing_grib.py tests/test_example_sgp.py tests/test_regression.py -k "lai or ldt or grib or forcing or example or noahmp50_snow or noahmp50_glacier"

  full:
    # all 49 regression tests (~30 min on CPU); weekly and on manual dispatch only
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.10"
      - run: uv sync --locked --extra test
      - run: uv run --locked pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t lisf-noahmp-jax:ci .
      - name: Smoke test container
        run: docker run --rm lisf-noahmp-jax:ci --help
